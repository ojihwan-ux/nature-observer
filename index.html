<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🌿 자연관찰 도우미</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #2e7d32;
  --primary-light: #4caf50;
  --bg: #f5f7f5;
  --chat-bg: #ffffff;
  --user-bg: #e8f5e9;
  --ai-bg: #f1f8e9;
  --sidebar-bg: #263238;
  --sidebar-text: #eceff1;
  --border: #c8e6c9;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  height: 100dvh;
  display: flex;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 0;
  background: var(--sidebar-bg);
  transition: width 0.3s;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar.open { width: 280px; }
.sidebar-header {
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.sidebar-header h3 { color: var(--sidebar-text); font-size: 15px; }
.sidebar-close {
  background: none; border: none; color: var(--sidebar-text);
  font-size: 20px; cursor: pointer; padding: 4px;
}
.new-chat-btn {
  margin: 12px 16px;
  padding: 10px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}
.new-chat-btn:active { background: var(--primary-light); }
.chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.chat-item {
  padding: 10px 12px;
  color: var(--sidebar-text);
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chat-item:hover, .chat-item.active { background: rgba(255,255,255,0.1); }
.chat-item .title { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.chat-item .delete-btn {
  background: none; border: none; color: #ef5350; font-size: 14px;
  cursor: pointer; padding: 2px 6px; display: none; flex-shrink: 0;
}
.chat-item:hover .delete-btn { display: block; }
.sidebar-overlay {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 9;
}
.sidebar-overlay.show { display: block; }

/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}

/* Header */
.header {
  background: var(--primary);
  color: #fff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.menu-btn {
  background: none; border: none; color: #fff;
  font-size: 22px; cursor: pointer; padding: 4px;
}
.header h1 { font-size: 17px; font-weight: 600; }

/* Chat area */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.welcome {
  text-align: center;
  padding: 40px 20px;
  color: #666;
}
.welcome h2 { font-size: 20px; color: var(--primary); margin-bottom: 8px; }
.welcome p { font-size: 14px; line-height: 1.6; }

.message {
  max-width: 85%;
  padding: 12px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.7;
  word-break: break-word;
}
.message.user {
  background: var(--user-bg);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.message.ai {
  background: var(--ai-bg);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
  border: 1px solid var(--border);
}
.message.ai h3 { font-size: 14px; color: var(--primary); margin: 8px 0 4px; }
.message.ai h3:first-child { margin-top: 0; }
.message.ai ul, .message.ai ol { padding-left: 18px; margin: 4px 0; }
.message.ai li { margin-bottom: 4px; }
.message.ai strong { color: #1b5e20; }
.message img {
  max-width: 200px;
  max-height: 200px;
  border-radius: 8px;
  margin-top: 4px;
}
.loading {
  align-self: flex-start;
  padding: 12px 20px;
  background: var(--ai-bg);
  border-radius: 16px;
  border-bottom-left-radius: 4px;
  border: 1px solid var(--border);
  font-size: 14px;
  color: #666;
}
.loading::after {
  content: ''; animation: dots 1.5s infinite;
}
@keyframes dots {
  0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; }
}

/* Input area */
.input-area {
  padding: 12px 16px;
  background: #fff;
  border-top: 1px solid #e0e0e0;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  flex-shrink: 0;
}
.upload-btn {
  background: none; border: none;
  font-size: 24px; cursor: pointer; padding: 6px;
  color: var(--primary);
  flex-shrink: 0;
}
.input-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.preview-container {
  display: none;
  position: relative;
  width: fit-content;
}
.preview-container img {
  max-height: 80px;
  border-radius: 8px;
}
.preview-remove {
  position: absolute; top: -6px; right: -6px;
  background: #ef5350; color: #fff; border: none;
  width: 22px; height: 22px; border-radius: 50%;
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.text-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #ddd;
  border-radius: 20px;
  font-size: 14px;
  outline: none;
  resize: none;
  max-height: 80px;
  font-family: inherit;
}
.text-input:focus { border-color: var(--primary); }
.send-btn {
  background: var(--primary);
  color: #fff;
  border: none;
  width: 40px; height: 40px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.send-btn:disabled { background: #bdbdbd; cursor: default; }
.send-btn:active:not(:disabled) { background: var(--primary-light); }

/* API key modal */
.modal-overlay {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  max-width: 360px;
  width: 100%;
}
.modal h3 { margin-bottom: 12px; color: var(--primary); }
.modal p { font-size: 13px; color: #666; margin-bottom: 16px; line-height: 1.5; }
.modal input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 12px;
}
.modal button {
  width: 100%;
  padding: 10px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>💬 대화 기록</h3>
    <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
  </div>
  <button class="new-chat-btn" onclick="newChat()">+ 새 대화</button>
  <div class="chat-list" id="chatList"></div>
</aside>

<!-- Main -->
<div class="main">
  <div class="header">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <h1>🌿 자연관찰 도우미</h1>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <h2>🌱 식물을 관찰해볼까요?</h2>
      <p>식물 사진을 올려주세요!<br>
      AI가 생존 전략과 발명 아이디어를<br>알려줄 거예요.</p>
    </div>
  </div>

  <div class="input-area">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📷</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <div class="input-wrapper">
      <div class="preview-container" id="previewContainer">
        <img id="previewImg">
        <button class="preview-remove" onclick="removeImage()">✕</button>
      </div>
      <textarea class="text-input" id="textInput" rows="1" placeholder="질문을 입력하세요 (선택)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
  </div>
</div>


<script>
const STORAGE_KEY = 'nature_observer_chats';
let currentChatId = null;
let selectedImage = null;
let selectedImageBase64 = null;

function getAllChats() {
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
}

function saveAllChats(chats) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
}

function getChatMessages(chatId) {
  const chats = getAllChats();
  return chats[chatId]?.messages || [];
}

function saveChatMessage(chatId, role, content, imageData) {
  const chats = getAllChats();
  if (!chats[chatId]) {
    chats[chatId] = { id: chatId, title: '새 대화', created: Date.now(), messages: [] };
  }
  const msg = { role, content, timestamp: Date.now() };
  if (imageData) msg.image = imageData;
  chats[chatId].messages.push(msg);

  if (chats[chatId].messages.filter(m => m.role === 'user').length === 1 && role === 'user') {
    chats[chatId].title = content
      ? content.substring(0, 30) + (content.length > 30 ? '...' : '')
      : '🌿 식물 관찰';
  }
  saveAllChats(chats);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function renderChatList() {
  const chats = getAllChats();
  const list = document.getElementById('chatList');
  // 생성 시각 오름차순으로 정렬 → 가장 먼저 시작한 대화가 1번, 다음이 2, 3, 4 ...
  const sorted = Object.values(chats).sort((a, b) => a.created - b.created);
  list.innerHTML = sorted.map((c, i) => `
    <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="loadChat('${c.id}')">
      <span class="title">${i + 1}</span>
      <button class="delete-btn" onclick="event.stopPropagation(); deleteChat('${c.id}')">🗑</button>
    </div>
  `).join('');
}

function deleteChat(chatId) {
  const chats = getAllChats();
  delete chats[chatId];
  saveAllChats(chats);
  if (chatId === currentChatId) newChat();
  else renderChatList();
}

function newChat() {
  currentChatId = 'chat_' + Date.now();
  document.getElementById('chatArea').innerHTML = `
    <div class="welcome">
      <h2>🌱 식물을 관찰해볼까요?</h2>
      <p>식물 사진을 올려주세요!<br>AI가 생존 전략과 발명 아이디어를<br>알려줄 거예요.</p>
    </div>`;
  removeImage();
  renderChatList();
  toggleSidebar();
}

function loadChat(chatId) {
  currentChatId = chatId;
  const messages = getChatMessages(chatId);
  const area = document.getElementById('chatArea');
  area.innerHTML = '';
  messages.forEach(m => {
    appendMessage(m.role, m.content, m.image, false);
  });
  renderChatList();
  toggleSidebar();
  area.scrollTop = area.scrollHeight;
}

function appendMessage(role, content, imageData, scroll = true) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `message ${role === 'user' ? 'user' : 'ai'}`;

  if (role === 'user') {
    let html = '';
    if (imageData) html += `<img src="${imageData}" alt="uploaded">`;
    if (content) html += `<p>${escapeHtml(content)}</p>`;
    div.innerHTML = html;
  } else {
    div.innerHTML = formatAIResponse(content);
  }

  area.appendChild(div);
  if (scroll) area.scrollTop = area.scrollHeight;
}

function formatAIResponse(text) {
  let html = text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/### (.*)/g, '<h3>$1</h3>')
    .replace(/## (.*)/g, '<h3>$1</h3>')
    .replace(/# (.*)/g, '<h3>$1</h3>');

  const lines = html.split('\n');
  let result = '';
  let inList = false;
  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed.startsWith('- ') || trimmed.startsWith('• ')) {
      if (!inList) { result += '<ul>'; inList = true; }
      result += `<li>${trimmed.substring(2)}</li>`;
    } else {
      if (inList) { result += '</ul>'; inList = false; }
      if (trimmed === '') result += '';
      else if (!trimmed.startsWith('<h3>')) result += `<p>${trimmed}</p>`;
      else result += trimmed;
    }
  }
  if (inList) result += '</ul>';
  return result;
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// Read file as data URL (always works for any image format).
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => resolve(ev.target.result);
    reader.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
    reader.readAsDataURL(file);
  });
}

// Try to resize+compress the data URL via canvas. If the browser can't decode
// the format (e.g. HEIC on non-Apple browsers), this rejects and the caller
// should fall back to sending the original.
function resizeDataURL(dataURL, maxDim = 1024, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = function() {
      try {
        let { width, height } = img;
        if (!width || !height) return reject(new Error('이미지 크기 0'));
        if (width > maxDim || height > maxDim) {
          if (width >= height) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      } catch (e) {
        reject(e);
      }
    };
    img.onerror = () => reject(new Error('이미지 디코딩 실패 (HEIC 등 미지원 형식일 수 있음)'));
    img.src = dataURL;
  });
}

// File input — preview shows IMMEDIATELY from the raw data URL so the UI never
// looks broken. Resize is attempted in the background; on failure we keep the
// original (server-side may reject if too large, but the user will see why).
document.getElementById('fileInput').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  console.log('[사진 선택]', { name: file.name, type: file.type, sizeKB: (file.size/1024).toFixed(1) });

  let originalDataURL;
  try {
    originalDataURL = await readFileAsDataURL(file);
  } catch (err) {
    alert('파일 읽기 실패: ' + err.message);
    return;
  }

  // Show preview + enable send right away with the original.
  selectedImage = file;
  selectedImageBase64 = originalDataURL;
  document.getElementById('previewImg').src = originalDataURL;
  document.getElementById('previewContainer').style.display = 'block';
  updateSendBtn();

  // Attempt to compress in background. Replace if successful and smaller.
  try {
    const resized = await resizeDataURL(originalDataURL, 1024, 0.85);
    const origKB = (originalDataURL.length / 1024).toFixed(1);
    const newKB = (resized.length / 1024).toFixed(1);
    console.log('[이미지 압축] ' + origKB + 'KB → ' + newKB + 'KB');
    if (resized.length < originalDataURL.length) {
      selectedImageBase64 = resized;
    }
  } catch (err) {
    console.warn('[이미지 압축 실패 — 원본 사용]', err.message);
    // Warn user only if original is dangerously large for the 4.5MB Edge limit.
    if (originalDataURL.length > 3_500_000) {
      alert('주의: 사진이 너무 크고 압축에도 실패했습니다 (' + (originalDataURL.length/1024/1024).toFixed(1) + 'MB). 전송 시 실패할 수 있어요. 다른 사진을 시도하거나 갤러리에서 작은 크기로 저장해 보세요.');
    }
  }
});

function removeImage() {
  selectedImage = null;
  selectedImageBase64 = null;
  document.getElementById('previewContainer').style.display = 'none';
  document.getElementById('previewImg').src = '';
  updateSendBtn();
}

function updateSendBtn() {
  document.getElementById('sendBtn').disabled = !selectedImage && !document.getElementById('textInput').value.trim();
}

document.getElementById('textInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 80) + 'px';
  updateSendBtn();
});

document.getElementById('textInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage() {
  const text = document.getElementById('textInput').value.trim();
  const imageData = selectedImageBase64;

  if (!text && !imageData) return;

  const chats = getAllChats();
  if (!chats[currentChatId]) {
    chats[currentChatId] = { id: currentChatId, title: '새 대화', created: Date.now(), messages: [] };
    saveAllChats(chats);
  }

  appendMessage('user', text, imageData);
  saveChatMessage(currentChatId, 'user', text, imageData);

  document.getElementById('textInput').value = '';
  document.getElementById('textInput').style.height = 'auto';
  removeImage();
  updateSendBtn();

  const area = document.getElementById('chatArea');
  const loading = document.createElement('div');
  loading.className = 'loading';
  loading.textContent = 'AI가 분석 중';
  area.appendChild(loading);
  area.scrollTop = area.scrollHeight;

  try {
    const response = await callGemini(text, imageData);
    loading.remove();
    appendMessage('ai', response);
    saveChatMessage(currentChatId, 'ai', response);
    renderChatList();
  } catch (err) {
    loading.remove();
    appendMessage('ai', '⚠️ 오류: ' + (err.message || err.toString()));
  }
}

async function callGemini(userText, imageBase64) {
  const url = `/api/chat`;

  const systemPrompt = `너는 초등학생을 위한 자연관찰 도우미 AI야.
학생이 식물 사진을 보내면, 아래 두 가지를 알려줘:

## 🔬 과학적 적응 원리 (생존 전략)
- 사진 속 식물의 특징(잎 모양, 줄기 구조, 뿌리, 꽃, 열매 등)을 관찰하고
- 그 특징이 식물이 살아남기 위해 어떤 역할을 하는지 쉽게 설명해줘
- 초등학생이 이해할 수 있는 쉬운 말로 설명해줘

## 💡 발명 포인트 (생체모방 아이디어)
- 이 식물의 특징을 따라해서 만들 수 있는 발명품 아이디어를 알려줘
- 초등학생이 직접 만들어볼 수 있는 수준의 아이디어로 제안해줘
- 예: 종이, 빨대, 테이프, 재활용품 등으로 만들 수 있는 것
- 구체적이고 재미있는 아이디어로 2-3개 제안해줘

답변은 친근하고 재미있게 해줘. 이모지를 적절히 사용해.
답변 길이는 간결하게, 핵심만 전달해줘.`;

  const parts = [{ text: systemPrompt + '\n\n' + (userText || '이 식물을 관찰해줘!') }];

  if (imageBase64) {
    const base64Data = imageBase64.split(',')[1];
    const mimeMatch = imageBase64.match(/data:(.*?);/);
    const mimeType = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    parts.push({
      inlineData: { mimeType, data: base64Data }
    });
  }

  const body = {
    contents: [{ parts }],
    generationConfig: {
      temperature: 0.7,
      maxOutputTokens: 2048,
      // gemini-2.5-flash는 기본으로 'thinking' 모드가 켜져 있어 출력 토큰의
      // 대부분을 내부 추론에 소비합니다. 0으로 두면 추론 없이 바로 답변 생성.
      thinkingConfig: { thinkingBudget: 0 }
    }
  };

  // === Diagnostic logging ===
  const requestPayload = JSON.stringify(body);
  const reqSizeKB = (requestPayload.length / 1024).toFixed(1);
  console.group('[AI 호출] 요청');
  console.log('URL:', url);
  console.log('요청 본문 크기:', reqSizeKB + ' KB');
  console.log('이미지 포함:', !!imageBase64);
  console.log('parts 개수:', parts.length);
  console.groupEnd();

  const t0 = performance.now();
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: requestPayload
    });
  } catch (netErr) {
    console.error('[AI 호출] 네트워크 실패:', netErr);
    throw new Error('네트워크 오류: ' + netErr.message + ' (요청 크기 ' + reqSizeKB + 'KB)');
  }
  const elapsed = (performance.now() - t0).toFixed(0);

  // Read body as text first so we can log raw response on parse failures.
  const rawText = await res.text();
  let parsed = null;
  let parseError = null;
  try {
    parsed = rawText ? JSON.parse(rawText) : null;
  } catch (e) {
    parseError = e.message;
  }

  console.group('[AI 호출] 응답 (' + elapsed + 'ms)');
  console.log('HTTP status:', res.status, res.statusText);
  console.log('Content-Type:', res.headers.get('content-type'));
  console.log('응답 본문 크기:', rawText.length + ' bytes');
  if (parsed) {
    console.log('파싱된 JSON:', parsed);
  } else {
    console.log('파싱 실패:', parseError);
    console.log('원본 응답 (처음 500자):', rawText.slice(0, 500));
  }
  console.groupEnd();

  // Build a diagnostic block to show inline in the chat on any failure.
  const diagBlock = (label) => {
    const ct = res.headers.get('content-type') || '없음';
    const bodyPreview = rawText.slice(0, 800);
    return "\n\n---\n**\uc9c4\ub2e8 \uc815\ubcf4** (__LABEL__)\n- HTTP: __STATUS__ __STATUSTEXT__\n- \uc18c\uc694: __ELAPSED__ms\n- \uc694\uccad \ud06c\uae30: __SIZE__ KB\n- Content-Type: __CT__\n- \uc751\ub2f5 \ubcf8\ubb38(\ucc98\uc74c 800\uc790):\n```\n__BODY__\n```"
      .replace('__LABEL__', label)
      .replace('__STATUS__', String(res.status))
      .replace('__STATUSTEXT__', res.statusText || '')
      .replace('__ELAPSED__', String(elapsed))
      .replace('__SIZE__', String(reqSizeKB))
      .replace('__CT__', ct)
      .replace('__BODY__', bodyPreview);
  };

  if (!res.ok) {
    const upstreamMsg = parsed?.error?.message
      || (typeof parsed?.error === 'string' ? parsed.error : null)
      || ('HTTP ' + res.status);
    throw new Error(upstreamMsg + diagBlock('호출 실패'));
  }

  if (!parsed) {
    throw new Error('응답을 JSON으로 해석할 수 없습니다.' + diagBlock('파싱 실패'));
  }

  const text = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) {
    // 200 OK 인데 candidates가 비어있는 경우(safety block 등) 진단 정보 노출
    throw new Error('응답에 텍스트가 없습니다.' + diagBlock('빈 응답'));
  }
  return text;
}

// Force clear stale caches (handles mobile browser aggressive caching)
if ('caches' in window) {
  caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}

// Init
if (!currentChatId) currentChatId = 'chat_' + Date.now();
renderChatList();
</script>
</body>
</html>
